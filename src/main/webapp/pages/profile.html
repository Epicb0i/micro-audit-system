<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MicroAudit — Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/profile.css"/>
  <style>
    /* Role-specific accent colours */
    .role-member .big-avatar{background:#2563eb}
    .role-member .profile-role{background:#eff6ff;border-color:#bfdbfe;color:#2563eb}
    .role-member .score-circle{background:conic-gradient(#2563eb var(--score-pct),var(--border) 0)}
    .role-member .score-num{color:#2563eb}

    .role-head .big-avatar{background:#7c3aed}
    .role-head .profile-role{background:#f5f3ff;border-color:#c4b5fd;color:#7c3aed}
    .role-head .score-circle{background:conic-gradient(#7c3aed var(--score-pct),var(--border) 0)}
    .role-head .score-num{color:#7c3aed}

    .role-auditor .big-avatar{background:#059669}
    .role-auditor .profile-role{background:#ecfdf5;border-color:#a7f3d0;color:#059669}
    .role-auditor .score-circle{background:conic-gradient(#059669 var(--score-pct),var(--border) 0)}
    .role-auditor .score-num{color:#059669}

    /* Role-specific panels */
    .role-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm);padding:20px 24px;margin-top:16px}
    .role-panel h3{font-family:'Fraunces',serif;font-size:14px;font-weight:400;color:var(--navy);margin-bottom:14px}
    .rp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .rp-stat{background:var(--bg);border-radius:10px;padding:14px 16px}
    .rp-stat .rp-val{font-family:'Fraunces',serif;font-size:24px;font-weight:300;line-height:1}
    .rp-stat .rp-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

    .approval-list{display:flex;flex-direction:column;gap:10px}
    .approval-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-radius:10px}
    .approval-item .ai-info{font-size:12px}
    .approval-item .ai-id{color:var(--accent);font-weight:600}
    .approval-item .ai-title{color:var(--text);margin-top:2px}
    .approval-item .ai-meta{color:var(--muted);font-size:11px;margin-top:2px}
    .approval-btns{display:flex;gap:8px}
    .btn-approve{padding:6px 14px;background:#16a34a;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
    .btn-approve:hover{background:#15803d}
    .btn-reject{padding:6px 14px;background:#dc2626;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
    .btn-reject:hover{background:#b91c1c}

    .audit-summary{display:flex;flex-direction:column;gap:10px}
    .audit-stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
    .audit-stat-row:last-child{border-bottom:none}
    .audit-stat-row .asr-label{color:var(--muted)}
    .audit-stat-row .asr-value{font-weight:600}

    .risk-indicator{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-size:12px;font-weight:500;margin-top:10px}
    .risk-low{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
    .risk-medium{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
    .risk-high{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .risk-icon{font-size:18px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

    .perm-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .perm-tag{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
    .perm-tag.active{background:#eff6ff;border-color:#bfdbfe;color:#2563eb}
    .perm-tag.head-active{background:#f5f3ff;border-color:#c4b5fd;color:#7c3aed}
    .perm-tag.auditor-active{background:#ecfdf5;border-color:#a7f3d0;color:#059669}
  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="logo-wrap">
    <div class="logo-text">Micro<span>Audit</span></div>
    <div class="logo-sub">Committee Tracker</div>
  </div>
  <nav class="nav">
    <div class="nav-label">Main</div>
    <a href="dashboard.html" class="nav-item"><span class="nav-icon">⚡</span> Dashboard</a>
    <a href="action-form.html" class="nav-item"><span class="nav-icon">＋</span> New Action</a>
    <a href="my-actions.html" class="nav-item"><span class="nav-icon">📋</span> My Actions <span class="badge">4</span></a>
    <a href="audit-logs.html" class="nav-item"><span class="nav-icon">🔍</span> Audit Logs</a>
    <div class="nav-label">Reports</div>
    <a href="analytics.html" class="nav-item"><span class="nav-icon">📊</span> Analytics</a>
    <a href="reports.html" class="nav-item"><span class="nav-icon">📁</span> Reports</a>
    <div class="nav-label">Account</div>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span> Profile</a>
    <a href="../index.html" class="nav-item" onclick="sessionStorage.clear()"><span class="nav-icon">🚪</span> Logout</a>
  </nav>
  <div class="sidebar-foot">
    <div class="user-card">
      <div class="avatar-sm" id="sidebarAvatar">--</div>
      <div><div class="uname" id="sidebarName">Loading...</div><div class="urole" id="sidebarRole">--</div></div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
    <div class="topbar-title">My Profile</div>
    <div class="tb-right">
      <button class="save-btn" onclick="saveProfile()">Save Changes</button>
    </div>
  </div>

  <div class="content" id="profileContent">
    <!-- Populated dynamically by JS based on user role -->
  </div>
</div>

<div class="toast" id="toast">Profile updated</div>
<script src="../js/User.js"></script>
<script>
/* ── Auth guard ── */
const user = User.fromSession();
if (!user) window.location.href = '../index.html';

const role = (user.role || 'Member').toLowerCase();

/* ── Role configuration ── */
const roleConfig = {
  member: {
    label:'Committee Member', color:'#2563eb', bgClass:'role-member', icon:'👤',
    stats:{ actions:12, onTime:9, delayed:3 }, score:84, scoreLabel:'Good Standing',
    permissions:['Create Actions','View Own Actions','Edit Profile','View Dashboard'],
    extraTab:'My Submissions',
    description:'You can create action requests, track their progress, and view your own audit trail.'
  },
  head: {
    label:'Committee Head', color:'#7c3aed', bgClass:'role-head', icon:'👑',
    stats:{ actions:28, approved:18, rejected:4, pending:6 }, score:92, scoreLabel:'Excellent Performance',
    permissions:['Approve/Reject Actions','View All Committee Actions','Generate Reports','Manage Members','View Audit Logs','Edit Profile'],
    extraTab:'Pending Approvals',
    description:'You can approve or reject actions, manage committee members, and access full audit trails.'
  },
  auditor: {
    label:'System Auditor', color:'#059669', bgClass:'role-auditor', icon:'🔍',
    stats:{ audits:156, flagged:12, resolved:144, riskLevel:'Low' }, score:96, scoreLabel:'System Healthy',
    permissions:['Full Audit Access','View All Actions','View All Users','Generate System Reports','View Analytics','Delay Pattern Analysis','Risk Assessment'],
    extraTab:'Audit Overview',
    description:'You have full read access to all actions, audit logs, analytics, and system health metrics.'
  }
};

const config = roleConfig[role] || roleConfig.member;

/* ── Render ── */
function renderProfile() {
  const content = document.getElementById('profileContent');
  const initials = user.name ? user.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase() : user.id.substring(0,2).toUpperCase();

  content.innerHTML = `
    <div class="left-col">
      <div class="profile-hero ${config.bgClass}">
        <div class="big-avatar" title="Click to change">${initials}</div>
        <div class="avatar-edit">Click to change photo</div>
        <div class="profile-name" id="heroName">${user.name||user.id}</div>
        <div class="profile-role"><span style="font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji'">${config.icon}</span> ${config.label}</div>
        <div class="profile-id">${user.id}</div>
      </div>

      <div class="stat-row">${buildStatRow()}</div>

      <div class="score-card ${config.bgClass}">
        <div class="sc-title">${role==='auditor'?'System Health Score':'Accountability Score'}</div>
        <div class="score-circle-wrap">
          <div class="score-circle" style="--score-pct:${config.score}%"><span class="score-num">${config.score}</span></div>
          <div class="score-detail">
            <b style="color:${config.color}">${config.scoreLabel}</b><br/>${buildScoreDetail()}
          </div>
        </div>
      </div>

      <div class="role-panel">
        <h3>${config.icon} ${config.label} Permissions</h3>
        <div class="perm-list">
          ${config.permissions.map(p=>`<span class="perm-tag ${role==='head'?'head-active':role==='auditor'?'auditor-active':'active'}">${p}</span>`).join('')}
        </div>
        <p style="font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6">${config.description}</p>
      </div>

      <div class="heatmap-card">
        <div class="hm-title">Activity — Last 12 Months</div>
        <div class="hm-grid" id="heatmap"></div>
      </div>
    </div>

    <div class="right-col">
      <div class="edit-panel">
        <div class="tab-bar">
          <div class="tab active" onclick="switchTab(this,'info')">Personal Info</div>
          <div class="tab" onclick="switchTab(this,'role-panel')">${config.extraTab}</div>
          <div class="tab" onclick="switchTab(this,'security')">Security</div>
        </div>

        <div class="tab-content active" id="tab-info">
          <div class="ep-sub-header"><h3>Personal Information</h3><p>Changes are timestamped and recorded in the audit trail.</p></div>
          <div class="ep-body">
            <div class="form-row">
              <div class="form-group"><label>Full Name</label><input type="text" id="fullName" value="${user.name||''}"/></div>
              <div class="form-group"><label>Staff ID</label><input type="text" value="${user.id}" readonly/></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Email Address</label><input type="email" id="email" value="${user.email||''}" placeholder="name@college.edu"/></div>
              <div class="form-group"><label>Phone</label><input type="tel" id="phone" value="${user.phone||''}" placeholder="+91 9XXXXXXXXX"/></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Department</label>
                <select id="dept">${['Computer Engineering','Information Technology','Electronics','Mechanical','Civil','Administration'].map(d=>`<option ${d===user.department?'selected':''}>${d}</option>`).join('')}</select>
              </div>
              <div class="form-group"><label>Committee</label>
                <select id="committee">${['Exam Committee','T&P Committee','Cultural Committee','NAAC Committee','Purchase Committee','Hostel Committee'].map(c=>`<option ${c===user.committee?'selected':''}>${c}</option>`).join('')}</select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Role</label><input type="text" value="${config.label}" readonly/></div>
              <div class="form-group"><label>Joined</label><input type="text" value="${new Date(user.loginTime).toLocaleDateString('en-US',{month:'long',year:'numeric'})}" readonly/></div>
            </div>
          </div>
        </div>

        <div class="tab-content" id="tab-role-panel">${buildRolePanel()}</div>

        <div class="tab-content" id="tab-security">
          <div class="security-list">
            <div class="security-item"><div><div class="si-label">Password</div><div class="si-sub">Last changed 30 days ago</div></div><button class="si-action" onclick="changePassword()">Change Password</button></div>
            <div class="security-item"><div><div class="si-label">Active Session</div><div class="si-sub">${user.sessionId}</div></div><span class="si-badge">Active</span></div>
            <div class="security-item"><div><div class="si-label">Login IP</div><div class="si-sub">192.168.1.x — College LAN</div></div><span class="si-badge">Verified</span></div>
            <div class="security-item"><div><div class="si-label">Role Level</div><div class="si-sub">${config.label} — ${config.permissions.length} permissions granted</div></div><span class="si-badge" style="background:${config.color}15;color:${config.color};border-color:${config.color}40">${user.role}</span></div>
            <div class="security-item"><div><div class="si-label">Two-Factor Auth</div><div class="si-sub">Adds an extra layer of security</div></div><button class="si-action">Enable 2FA</button></div>
            <div class="security-item" style="border:none"><div><div class="si-label">Audit Log</div><div class="si-sub">Download your activity history</div></div><button class="si-action">Download</button></div>
          </div>
        </div>
      </div>
    </div>`;

  buildHeatmap();
}

/* ── Stat row per role ── */
function buildStatRow(){
  if(role==='member') return `<div class="stat-cell"><div class="stat-n">${config.stats.actions}</div><div class="stat-l">Actions</div></div><div class="stat-cell"><div class="stat-n g">${config.stats.onTime}</div><div class="stat-l">On Time</div></div><div class="stat-cell"><div class="stat-n r">${config.stats.delayed}</div><div class="stat-l">Delayed</div></div>`;
  if(role==='head') return `<div class="stat-cell"><div class="stat-n">${config.stats.actions}</div><div class="stat-l">Total</div></div><div class="stat-cell"><div class="stat-n g">${config.stats.approved}</div><div class="stat-l">Approved</div></div><div class="stat-cell"><div class="stat-n r">${config.stats.pending}</div><div class="stat-l">Pending</div></div>`;
  return `<div class="stat-cell"><div class="stat-n">${config.stats.audits}</div><div class="stat-l">Audits</div></div><div class="stat-cell"><div class="stat-n g">${config.stats.resolved}</div><div class="stat-l">Resolved</div></div><div class="stat-cell"><div class="stat-n r">${config.stats.flagged}</div><div class="stat-l">Flagged</div></div>`;
}

function buildScoreDetail(){
  if(role==='member') return `${config.stats.onTime} of ${config.stats.actions} actions on time.<br/><span class="warn-text">${config.stats.delayed} delays recorded</span>`;
  if(role==='head') return `${config.stats.approved} actions approved this semester.<br/><span class="warn-text">${config.stats.rejected} rejected, ${config.stats.pending} pending</span>`;
  return `${config.stats.resolved} of ${config.stats.audits} items cleared.<br/><span class="warn-text">${config.stats.flagged} items flagged for review</span>`;
}

function buildRolePanel(){
  if(role==='member') return buildMemberPanel();
  if(role==='head')   return buildHeadPanel();
  return buildAuditorPanel();
}

/* ── Member: My Submissions ── */
function buildMemberPanel(){
  const actions=[
    {id:'ACT-001',title:'Equipment Purchase Approval',committee:'Purchase',status:'Review',date:'Feb 01'},
    {id:'ACT-003',title:'Cultural Fest Budget Sanction',committee:'Cultural',status:'Created',date:'Feb 03'},
    {id:'ACT-007',title:'Lab Maintenance Request',committee:'Hostel',status:'Approved',date:'Jan 15'}
  ];
  return `<div style="padding:20px 24px">
    <h3 style="font-family:'Fraunces',serif;font-size:15px;font-weight:400;color:var(--navy);margin-bottom:16px">My Submitted Actions</h3>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr>
        <th style="text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">ID</th>
        <th style="text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">Title</th>
        <th style="text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">Committee</th>
        <th style="text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">Status</th>
        <th style="text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border)">Date</th>
      </tr></thead>
      <tbody>${actions.map(a=>`<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:12px;color:var(--accent);font-weight:600">${a.id}</td>
        <td style="padding:12px">${a.title}</td>
        <td style="padding:12px;color:var(--muted)">${a.committee}</td>
        <td style="padding:12px"><span class="status-badge s-${a.status.toLowerCase()}">${a.status}</span></td>
        <td style="padding:12px;color:var(--muted)">${a.date}</td>
      </tr>`).join('')}</tbody>
    </table>
    <p style="font-size:11px;color:var(--muted);margin-top:16px;text-align:center"><a href="my-actions.html" style="color:var(--accent);font-weight:500">View all my actions &rarr;</a></p>
  </div>`;
}

/* ── Head: Pending Approvals ── */
function buildHeadPanel(){
  const pending=[
    {id:'ACT-001',title:'Equipment Purchase Approval',by:'STF002 — Prof. Patel',priority:'high',created:'Feb 01'},
    {id:'ACT-003',title:'Cultural Fest Budget Sanction',by:'STF003 — Dr. Kumar',priority:'high',created:'Feb 03'},
    {id:'ACT-009',title:'Printing Supplies Request',by:'STF006 — Prof. Gupta',priority:'low',created:'Feb 12'}
  ];
  return `<div style="padding:20px 24px">
    <h3 style="font-family:'Fraunces',serif;font-size:15px;font-weight:400;color:var(--navy);margin-bottom:4px">Pending Approvals</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Actions waiting for your review and approval.</p>
    <div class="approval-list">
      ${pending.map(p=>`<div class="approval-item">
        <div class="ai-info">
          <div class="ai-id">${p.id} <span style="color:${{high:'var(--danger)',medium:'var(--warn)',low:'var(--success)'}[p.priority]};font-size:10px;font-weight:600;text-transform:uppercase;margin-left:6px">${p.priority}</span></div>
          <div class="ai-title">${p.title}</div>
          <div class="ai-meta">By ${p.by} &middot; ${p.created}</div>
        </div>
        <div class="approval-btns">
          <button class="btn-approve" onclick="approveAction('${p.id}',this)">&#10003; Approve</button>
          <button class="btn-reject" onclick="rejectAction('${p.id}',this)">&#10005; Reject</button>
        </div>
      </div>`).join('')}
    </div>
    <div class="rp-grid" style="margin-top:16px">
      <div class="rp-stat"><div class="rp-val" style="color:#7c3aed">${config.stats.approved}</div><div class="rp-lbl">Approved This Sem</div></div>
      <div class="rp-stat"><div class="rp-val" style="color:var(--danger)">${config.stats.rejected}</div><div class="rp-lbl">Rejected</div></div>
    </div>
  </div>`;
}

/* ── Auditor: Audit Overview ── */
function buildAuditorPanel(){
  const rl=config.stats.riskLevel;
  const rc=rl==='Low'?'risk-low':rl==='Medium'?'risk-medium':'risk-high';
  const ri=rl==='Low'?'🟢':rl==='Medium'?'🟡':'🔴';
  return `<div style="padding:20px 24px">
    <h3 style="font-family:'Fraunces',serif;font-size:15px;font-weight:400;color:var(--navy);margin-bottom:4px">System Audit Overview</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px">Real-time system health and compliance status.</p>
    <div class="risk-indicator ${rc}">
      <span class="risk-icon">${ri}</span>
      <div><div style="font-weight:600">System Risk: ${rl}</div><div style="font-size:11px;opacity:.8">${config.stats.flagged} items flagged out of ${config.stats.audits} total audits</div></div>
    </div>
    <div class="audit-summary" style="margin-top:16px">
      <div class="audit-stat-row"><span class="asr-label">Total Audit Entries</span><span class="asr-value">${config.stats.audits}</span></div>
      <div class="audit-stat-row"><span class="asr-label">Resolved Items</span><span class="asr-value" style="color:var(--success)">${config.stats.resolved}</span></div>
      <div class="audit-stat-row"><span class="asr-label">Flagged for Review</span><span class="asr-value" style="color:var(--danger)">${config.stats.flagged}</span></div>
      <div class="audit-stat-row"><span class="asr-label">Resolution Rate</span><span class="asr-value">${Math.round((config.stats.resolved/config.stats.audits)*100)}%</span></div>
      <div class="audit-stat-row"><span class="asr-label">Avg Response Time</span><span class="asr-value">4.2 hours</span></div>
      <div class="audit-stat-row"><span class="asr-label">Compliance Score</span><span class="asr-value" style="color:#059669">${config.score}/100</span></div>
    </div>
    <div class="rp-grid" style="margin-top:16px">
      <div class="rp-stat"><div class="rp-val" style="color:#059669">${config.stats.audits}</div><div class="rp-lbl">Total Audits</div></div>
      <div class="rp-stat"><div class="rp-val" style="color:var(--warn)">${config.stats.flagged}</div><div class="rp-lbl">Flagged</div></div>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:16px;text-align:center">
      <a href="audit-logs.html" style="color:#059669;font-weight:500">View Full Audit Logs &rarr;</a>
      &nbsp;|&nbsp;
      <a href="analytics.html" style="color:#059669;font-weight:500">Analytics Dashboard &rarr;</a>
    </p>
  </div>`;
}

/* ── Tab switching ── */
function switchTab(el,id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}

/* ── Head: approve / reject ── */
function approveAction(id,btn){
  const item=btn.closest('.approval-item');
  item.style.background='#f0fdf4';
  item.querySelector('.approval-btns').innerHTML='<span style="color:var(--success);font-weight:600;font-size:12px">&#10003; Approved</span>';
  showToast('Action '+id+' approved');
}
function rejectAction(id,btn){
  const item=btn.closest('.approval-item');
  item.style.background='#fef2f2';
  item.querySelector('.approval-btns').innerHTML='<span style="color:var(--danger);font-weight:600;font-size:12px">&#10005; Rejected</span>';
  showToast('Action '+id+' rejected');
}

/* ── Heatmap ── */
function buildHeatmap(){
  const grid=document.getElementById('heatmap');
  if(!grid) return;
  const cmap={
    member: ['rgba(37,99,235,0.06)','rgba(37,99,235,0.15)','rgba(37,99,235,0.3)','rgba(37,99,235,0.5)','rgba(37,99,235,0.8)'],
    head:   ['rgba(124,58,237,0.06)','rgba(124,58,237,0.15)','rgba(124,58,237,0.3)','rgba(124,58,237,0.5)','rgba(124,58,237,0.8)'],
    auditor:['rgba(5,150,105,0.06)','rgba(5,150,105,0.15)','rgba(5,150,105,0.3)','rgba(5,150,105,0.5)','rgba(5,150,105,0.8)']
  };
  const pal=cmap[role]||cmap.member;
  for(let i=0;i<48;i++){const c=document.createElement('div');c.className='hm-cell';const n=Math.floor(Math.random()*5);c.style.background=pal[n];c.title='Activity: '+n;grid.appendChild(c);}
}

/* ── Save profile ── */
function saveProfile(){
  user.name=document.getElementById('fullName').value;
  user.email=document.getElementById('email').value;
  user.phone=document.getElementById('phone').value;
  user.department=document.getElementById('dept').value;
  user.committee=document.getElementById('committee').value;
  const h=document.getElementById('heroName');
  if(h) h.textContent=user.name;
  sessionStorage.setItem('currentUser',user.toJSON());
  showToast('Profile updated successfully');
}

function changePassword(){
  const pw=prompt('Enter new password (min 6 characters):');
  if(pw&&pw.length>=6) showToast('Password changed successfully');
  else if(pw) alert('Password must be at least 6 characters.');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

/* ── Sidebar ── */
(function(){
  const ini=user.name?user.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase():user.id.substring(0,2).toUpperCase();
  document.getElementById('sidebarAvatar').textContent=ini;
  document.getElementById('sidebarName').textContent=user.name||user.id;
  document.getElementById('sidebarRole').textContent=user.role;
})();

renderProfile();

(function(){
  const btn=document.getElementById('hamburgerBtn'),sb=document.getElementById('sidebar'),ov=document.getElementById('sidebarOverlay');

  function toggle(){sb.classList.toggle('open');ov.classList.toggle('open');}
  btn.addEventListener('click',toggle);
  ov.addEventListener('click',toggle);
})();
